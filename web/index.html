<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>melonDS → DeSmuME ステート変換</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
  body { max-width: 42rem; margin: 8vh auto; padding: 0 1.25rem; }
  h1 { font-size: clamp(1.55rem, 5vw, 2.35rem); line-height: 1.2; }
  form { display: grid; gap: 1rem; }
  label { display: grid; gap: .3rem; font-weight: 600; }
  input, button { font: inherit; }
  input[type=file] { width: 100%; box-sizing: border-box; }
  input::file-selector-button, button { padding: .45rem .8rem; }
  button { justify-self: start; }
  .consent { display: block; font-weight: 400; }
  output { min-height: 1.6em; overflow-wrap: anywhere; }
</style>
<main>
  <h1>melonDS → DeSmuME</h1>
  <p>同じDS ROMのステートまたはゲーム内セーブを使います。選んだファイルはブラウザ内で処理します。</p>
  <form id="convert">
    <label>変換元の melonDS ステート（形式 14.0）
      <input id="ml" type="file" required>
    </label>
    <label>同じROMの DeSmuME ステート（内部形式 12 / 13）またはゲーム内セーブ（.sav）
      <input id="dst" type="file" required>
    </label>
    <label>ニンテンドーDS ROM（.nds）
      <input id="rom" type="file" accept=".nds" required>
    </label>
    <label>ARM7 BIOS（任意。melonDSで外部BIOSを使った場合）
      <input id="bios" type="file" accept=".bin">
    </label>
    <label class="consent"><input type="checkbox" required>
      試験版です。3D・音声・通信・タイマーなどは変換先ステートの状態を引き継ぎます。.sav の場合は起動直後の状態が使われます。ゲームが停止したり、画面が崩れたりする場合があります。
    </label>
    <button>変換して .dst を保存</button>
    <output id="status" role="status" aria-live="polite"></output>
  </form>
</main>
<script type="module" src="./app.js"></script>
</html>
